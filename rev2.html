<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOJA DE CDS</title>
</head>
<body>
    FAÇA SEU PEDIDO: 
    <select id="info">
        <option value="fita Cassete">Fita Cassete</option>
        <option value="DVD">DVD</option>
        <option value="CD">CD</option>
    </select>
    
    <button onclick="informacoes()">Consulte Informações</button>
    <div id="resultadoCD"></div>

    <script>
        function informacoes() {
            let produto = document.getElementById("info").value;
            let resultado = "";

            if (produto === "fita Cassete") {
                resultado = "Fita cassete é um formato de mídia analógica para gravação e reprodução de áudio";
            } else if (produto === "DVD") {
                resultado = "DVD é uma mídia de armazenamento de dados que utiliza tecnologia óptica para armazenar informações, como filmes, jogos e músicas.";
            } else if (produto === "CD") {
                resultado = "CD é um disco óptico digital de armazenamento de dados.";
            }

            document.getElementById("resultadoCD").innerHTML = 
                `As informações sobre ${produto} são: ${resultado}`;
        }
    </script>
</body>
</html>
